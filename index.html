<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CHUYMA BODEGA - Control Violeta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>body { background: linear-gradient(135deg, #4c1d95, #2e1065); min-height: 100vh; color: white; }</style>
</head>
<body class="p-4">

    <!-- APP -->
    <div id="vista-app" class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-black text-purple-200">BODEGA CHUYMA</h1>
            <button onclick="auth.signOut()" class="bg-purple-800 px-4 py-2 rounded-lg text-xs">SALIR</button>
        </header>

        <!-- NAVEGACIÓN -->
        <div class="flex gap-2 overflow-x-auto pb-4 mb-4">
            <button onclick="filtrar('todas')" class="px-4 py-2 bg-purple-700 rounded-lg">Todas</button>
            <button onclick="filtrar('malta')" class="px-4 py-2 bg-purple-700 rounded-lg">Maltas</button>
            <button onclick="filtrar('lupulo')" class="px-4 py-2 bg-purple-700 rounded-lg">Lúpulos</button>
            <button onclick="filtrar('levadura')" class="px-4 py-2 bg-purple-700 rounded-lg">Levaduras</button>
            <button onclick="filtrar('laboratorio')" class="px-4 py-2 bg-purple-700 rounded-lg">Lab</button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <button onclick="abrirForm('nuevo')" class="bg-emerald-600 p-4 rounded-xl font-bold">📦 NUEVO INSUMO</button>
            <button onclick="abrirForm('salida')" class="bg-rose-600 p-4 rounded-xl font-bold">📤 REGISTRAR SALIDA</button>
        </div>

        <div id="lista-insumos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- FORMULARIO ÚNICO -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-purple-900 p-6 rounded-2xl w-full max-w-lg border border-purple-500">
            <h2 id="modal-titulo" class="text-xl font-black mb-4">Gestión</h2>
            
            <div id="seccion-qr" class="hidden flex flex-col items-center mb-4">
                <div id="qrcode" class="bg-white p-2"></div>
                <button onclick="descargarQR()" class="mt-2 text-xs underline">Descargar Etiqueta QR</button>
            </div>

            <div id="campos-form" class="space-y-3">
                <!-- Se llenará dinámicamente -->
            </div>

            <div class="mt-6 flex gap-2">
                <button id="btn-accion" class="flex-1 bg-purple-500 font-black p-3 rounded-xl">GUARDAR</button>
                <button onclick="document.getElementById('modal').classList.add('hidden')" class="bg-purple-800 p-3 rounded-xl">CERRAR</button>
            </div>
        </div>
    </div>

    <script>
        var config = { /* TU CONFIG DE FIREBASE AQUI */ };
        firebase.initializeApp(config);
        var db = firebase.firestore();
        
        // Lógica de Renderizado y Filtros (Simplificada)
        function abrirForm(tipo, id = null) {
            const modal = document.getElementById('modal');
            const campos = document.getElementById('campos-form');
            if(tipo === 'nuevo') {
                campos.innerHTML = `<input type="text" id="nombre" placeholder="Nombre" class="w-full p-2 bg-purple-800 rounded">
                                    <input type="number" id="stock" placeholder="Stock" class="w-full p-2 bg-purple-800 rounded">
                                    <input type="text" id="lote" placeholder="Lote Trazabilidad" class="w-full p-2 bg-purple-800 rounded">`;
            } else {
                // Lógica de Salida con select de insumos
                campos.innerHTML = `<select id="select-insumo" class="w-full p-2 bg-purple-800 rounded"></select>
                                    <input type="text" id="lote-bf" placeholder="Lote Brewfather" class="w-full p-2 bg-purple-800 rounded">`;
            }
            modal.classList.remove('hidden');
        }

        function descargarQR() {
            const link = document.createElement('a');
            link.download = 'etiqueta-chuyma.png';
            link.href = document.getElementById('qrcode').querySelector('img').src;
            link.click();
        }
    </script>
</body>
</html>
