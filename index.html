<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyma Bodega & Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased">

    <div id="vista-login" class="flex flex-col items-center justify-center min-h-screen px-4">
        <div class="bg-gray-900 border border-amber-500/30 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h1 class="text-4xl font-black text-center text-amber-500 tracking-wider mb-1">CHUYMA</h1>
            <p class="text-gray-400 text-center text-xs uppercase tracking-widest mb-8">Bodega & Control de Laboratorio</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Contraseña</label>
                    <input type="password" id="login-password" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <button id="btn-login" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-black py-4 px-4 rounded-xl transition duration-200 mt-2 text-lg uppercase tracking-wide cursor-pointer">
                    Abrir Sistema
                </button>
                <p id="login-error" class="text-red-400 text-sm text-center font-semibold mt-2 hidden"></p>
            </div>
        </div>
    </div>

    <div id="vista-app" class="hidden min-h-screen flex flex-col">
        <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40">
            <div class="max-w-6xl w-full mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-amber-500 tracking-wide">CHUYMA BODEGA</h1>
                    <p class="text-xs text-gray-400 font-medium">Panel de Trazabilidad Operativa</p>
                </div>
                <div class="flex items-center gap-4">
                    <div id="alerta-status" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-800 text-xs font-bold border border-gray-700"></div>
                    <button id="btn-logout" class="bg-red-950/40 hover:bg-red-900/40 border border-red-800 text-red-300 font-bold px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">
                        Salir
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 p-4 max-w-6xl w-full mx-auto space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="buscador" placeholder="🔍 Buscar insumo por nombre o lote..." class="md:col-span-1 w-full bg-gray-900 border border-gray-800 rounded-xl p-4 text-white text-base focus:outline-none focus:border-amber-500 placeholder-gray-500 shadow-inner">
                <button id="btn-abrir-camara" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-black p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    📷 ESCANEAR QR EN PLANTA
                </button>
                <button id="btn-nuevo-insumo" class="bg-gray-900 hover:bg-gray-850 text-amber-500 border border-amber-500/20 font-bold p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    📦 INGRESAR NUEVO ELEMENTO
                </button>
            </div>

            <div id="contenedor-camara" class="hidden bg-black p-4 rounded-2xl border border-amber-500 max-w-md mx-auto relative shadow-2xl">
                <div id="lector-qr" class="w-full overflow-hidden rounded-xl"></div>
                <button id="btn-cerrar-camara" class="w-full bg-red-600 hover:bg-red-700 text-white font-black p-3 rounded-xl mt-3 text-xs uppercase tracking-wider transition cursor-pointer">
                    Apagar Cámara
                </button>
            </div>

            <div class="flex gap-1 overflow-x-auto pb-2 border-b border-gray-800 no-scrollbar">
                <button onclick="filtrarPorPestana('todas')" id="tab-todas" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-amber-500 text-gray-950 shadow">Todas</button>
                <button onclick="filtrarPorPestana('malta')" id="tab-malta" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200">Maltas</button>
                <button onclick="filtrarPorPestana('lupulo')" id="tab-lupulo" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200">Lúpulos</button>
                <button onclick="filtrarPorPestana('clarificante')" id="tab-clarificante" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200">Clarificantes</button>
                <button onclick="filtrarPorPestana('laboratorio')" id="tab-laboratorio" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200">Laboratorio</button>
                <button onclick="filtrarPorPestana('levadura')" id="tab-levadura" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200">Levaduras</button>
                <button onclick="filtrarPorPestana('limpieza')" id="tab-limpieza" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200">Limpieza</button>
                <button onclick="filtrarPorPestana('empaque')" id="tab-empaque" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200">Insumos Secos</button>
            </div>

            <div id="lista-insumos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <div id="form-insumo" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-6 shadow-2xl relative max-w-4xl mx-auto">
                <h2 id="form-titulo" class="text-2xl font-black text-amber-500 border-b border-gray-800 pb-3 uppercase tracking-wide">Ficha Técnica</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Categoría General</label>
                                <select id="insumo-categoria" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-amber-500">
                                    <option value="malta">Maltas</option>
                                    <option value="lupulo">Lúpulos</option>
                                    <option value="clarificante">Clarificantes</option>
                                    <option value="laboratorio">Laboratorio</option>
                                    <option value="levadura">Microbiología (Levaduras)</option>
                                    <option value="limpieza">Limpieza e Higiene</option>
                                    <option value="empaque">Insumos Secos</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Nombre / Identificación</label>
                                <input type="text" id="insumo-nombre" placeholder="Ej: Botellas Amber / Cajas Master" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cantidad Actual</label>
                                <input type="number" step="any" id="insumo-stock" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cantidad Mínima</label>
                                <input type="number" step="any" id="insumo-minimo" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Lote Trazabilidad</label>
                                <input type="text" id="insumo-lote" placeholder="S/L" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <div id="campos-dinamicos" class="bg-gray-950 p-4 rounded-xl border border-gray-800 grid grid-cols-1 sm:grid-cols-2 gap-3 min-h-[60px] flex items-center"></div>
                    </div>

                    <div class="bg-gray-950 p-4 rounded-2xl border border-gray-800 flex flex-col items-center justify-center text-center min-h-[220px]">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Trazabilidad QR Física</span>
                        <div id="qrcode-container" class="bg-white p-3 rounded-xl inline-block shadow-lg"></div>
                        <button id="btn-imprimir-qr" class="w-full bg-gray-800 hover:bg-gray-750 text-amber-500 font-bold text-xs py-2.5 rounded-xl mt-4 border border-amber-500/10 transition flex items-center justify-center gap-1.5 cursor-pointer">
                            🖨️ IMPRIMIR ETIQUETA QR
                        </button>
                    </div>
                </div>

                <div class="flex gap-3 justify-end border-t border-gray-800 pt-4">
                    <button id="btn-cancelar" class="bg-gray-750 text-gray-400 font-bold px-5 py-3 rounded-xl hover:bg-gray-700 transition cursor-pointer">Cancelar</button>
                    <button id="btn-guardar" class="bg-amber-500 text-gray-950 font-black px-8 py-3 rounded-xl hover:bg-amber-600 transition uppercase tracking-wider text-sm cursor-pointer">Guardar Ficha</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBSaIzbcFiyTF1zy9_9Z97ZSPfL322xO24",
            authDomain: "inventariochuyma-da052.firebaseapp.com",
            projectId: "inventariochuyma-da052",
            storageBucket: "inventariochuyma-da052.firebasestorage.app",
            messagingSenderId: "677439195293",
            appId: "1:677439195293:web:50b624de9e0c877c89ec74"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        var insumosLocales = [];
        var qrScanner = null;
        var idInsumoSeleccionado = null;
        var pestanaActual = "todas";

        var vistaLogin = document.getElementById('vista-login');
        var vistaApp = document.getElementById('vista-app');
        var errorTxt = document.getElementById('login-error');
        var buscador = document.getElementById('buscador');
        var listaInsumos = document.getElementById('lista-insumos');
        var formInsumo = document.getElementById('form-insumo');
        var qrcodeContainer = document.getElementById('qrcode-container');
        var camposDinamicos = document.getElementById('campos-dinamicos');

        document.getElementById('btn-login').addEventListener('click', function(e) {
            e.preventDefault();
            errorTxt.classList.add('hidden');
            var email = document.getElementById('login-email').value.trim();
            var pass = document.getElementById('login-password').value.trim();
            if(!email || !pass) { return; }
            auth.signInWithEmailAndPassword(email, pass).catch(function() {
                errorTxt.textContent = "Clave o usuario incorrecto.";
                errorTxt.classList.remove('hidden');
            });
        });

        document.getElementById('btn-logout').addEventListener('click', function() { auth.signOut(); });

        auth.onAuthStateChanged(function(user) {
            if (user) {
                vistaLogin.classList.add('hidden');
                vistaApp.classList.remove('hidden');
                db.collection("inventario").onSnapshot(function(snapshot) {
                    insumosLocales = [];
                    snapshot.forEach(function(doc) {
                        insumosLocales.push(Object.assign({ id: doc.id }, doc.data()));
                    });
                    evaluarAlertasYRender();
                });
            } else {
                vistaLogin.classList.remove('hidden');
                vistaApp.classList.add('hidden');
            }
        });

        window.filtrarPorPestana = function(categoria) {
            pestanaActual = categoria;
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-gray-900 text-gray-400 hover:text-gray-200";
            });
            document.getElementById('tab-' + categoria).className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm tracking-wide transition whitespace-nowrap bg-amber-500 text-gray-950 shadow";
            ejecutarFiltro();
        };

        function ejecutarFiltro() {
            var txt = buscador.value.toLowerCase();
            var filtrados = insumosLocales.filter(function(i) {
                var matchesTab = (pestanaActual === 'todas' || i.categoria === pestanaActual);
                var matchesTxt = i.nombre.toLowerCase().includes(txt) || (i.lote && i.lote.toLowerCase().includes(txt));
                return matchesTab && matchesTxt;
            });
            renderLista(filtrados);
        }

        buscador.addEventListener('input', ejecutarFiltro);

        function evaluarAlertasYRender() {
            var quiebreActivo = false;
            insumosLocales.forEach(function(item) {
                if (item.minimo && Number(item.stock) <= Number(item.minimo)) { quiebreActivo = true; }
            });
            var statusDiv = document.getElementById('alerta-status');
            if (quiebreActivo) {
                statusDiv.innerHTML = '<span class="w-2.5 h-2.5 bg-red-500 rounded-full inline-block animate-ping"></span> CANTIDAD CRÍTICA';
                statusDiv.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-950/30 text-red-400 text-xs font-black border border-red-900/50";
            } else {
                statusDiv.innerHTML = '<span class="w-2.5 h-2.5 bg-green-400 rounded-full inline-block"></span> OPERACIÓN SEGURA';
                statusDiv.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-900 text-green-400 text-xs font-bold border border-gray-800";
            }
            ejecutarFiltro();
        }

        function renderLista(datos) {
            listaInsumos.innerHTML = "";
            if (datos.length === 0) {
                listaInsumos.innerHTML = `<div class="col-span-full text-center py-12 text-gray-600 font-medium text-sm">No hay insumos registrados.</div>`;
                return;
            }
            datos.forEach(function(item) {
                var esCritico = item.minimo && Number(item.stock) <= Number(item.minimo);
                var unidad = "unidades";
                if (item.categoria === 'malta') unidad = "kg";
                if (item.categoria === 'lupulo' || item.categoria === 'clarificante') unidad = "g";

                var card = document.createElement('div');
                card.className = `bg-gray-900 p-5 rounded-2xl border transition shadow-lg flex flex-col justify-between h-48 ${esCritico ? 'border-red-600/60 shadow-red-950/10' : 'border-gray-850 hover:border-gray-800'}`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-black text-white text-lg truncate w-full tracking-wide">${item.nombre}</h3>
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-gray-850 text-amber-500 tracking-wider">${item.categoria}</span>
                        </div>
                        <p class="text-xs font-bold text-gray-500 mt-1">Lote: <span class="text-gray-300">${item.lote || 'S/L'}</span></p>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-850 pt-3">
                        <div class="flex items-center gap-1.5">
                            <button onclick="cambiarStock('${item.id}', -1)" class="bg-gray-800 text-white w-11 h-11 rounded-xl font-black text-xl cursor-pointer">-</button>
                            <div class="text-center min-w-[60px]">
                                <span class="font-black text-xl text-white block">${item.stock}</span>
                                <span class="text-[9px] text-gray-500 uppercase font-bold block -mt-1">${unidad}</span>
                            </div>
                            <button onclick="cambiarStock('${item.id}', 1)" class="bg-gray-800 text-white w-11 h-11 rounded-xl font-black text-xl cursor-pointer">+</button>
                        </div>
                        <button onclick="verFicha('${item.id}')" class="bg-amber-500 text-gray-950 font-black px-4 py-2.5 rounded-xl text-xs uppercase tracking-wider cursor-pointer">Ver Ficha</button>
                    </div>
                `;
                listaInsumos.appendChild(card);
            });
        }

        window.cambiarStock = function(id, cambio) {
            var item = insumosLocales.find(function(i) { return i.id === id; });
            if(item) {
                db.collection("inventario").doc(id).update({ stock: Math.max(0, Number(item.stock) + cambio) });
            }
        };

        var categoriaSelect = document.getElementById('insumo-categoria');
        categoriaSelect.addEventListener('change', function(e) { pintarCamposDinamicos(e.target.value); });

        function pintarCamposDinamicos(cat, datos) {
            datos = datos || {};
            camposDinamicos.innerHTML = "";
            if (cat === 'malta') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Origen / Proveedor</label><input type="text" id="m-origen" value="${datos.origen || ''}" class="w-full bg-gray-900 border border-gray-800 p-2.5 rounded-xl text-xs text-white"></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Color (EBC / Lovibond)</label><input type="text" id="m-color" value="${datos.color || ''}" class="w-full bg-gray-900 border border-gray-800 p-2.5 rounded-xl text-xs text-white"></div>
                `;
            } else if (cat === 'lupulo') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Formato Presentación</label>
                        <select id="l-formato" class="w-full bg-gray-900 border border-gray-800 p-2.5 rounded-xl text-xs text-white font-semibold">
                            <option value="Pellets (T90)" ${datos.formato === 'Pellets (T90)' ? 'selected' : ''}>Pellets (T90)</option>
                            <option value="Plug" ${datos.formato === 'Plug' ? 'selected' : ''}>Plug</option>
                            <option value="Flor" ${datos.formato === 'Flor' ? 'selected' : ''}>Flor (Whole)</option>
                            <option value="Cryo" ${datos.formato === 'Cryo' ? 'selected' : ''}>Extracto / Cryo</option>
                        </select></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Alfa-Ácidos (% AA)</label><input type="text" id="l-alfa" value="${datos.alfa || ''}" class="w-full bg-gray-900 border border-gray-800 p-2.5 rounded-xl text-xs text-white"></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Año de Cosecha (Crop)</label><input type="text" id="l-cosecha" value="${datos.cosecha || ''}" class="w-full bg-gray
