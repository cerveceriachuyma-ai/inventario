<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BODEGA CHUYMA - Control Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-4">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-black mb-6 text-purple-400">BODEGA CHUYMA</h1>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button onclick="abrirForm('nuevo')" class="bg-emerald-600 p-4 rounded-xl font-bold uppercase">📦 Nuevo Insumo</button>
            <button onclick="abrirForm('consumo')" class="bg-rose-600 p-4 rounded-xl font-bold uppercase">📤 Consumo Receta</button>
        </div>
        <div id="lista-insumos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
        <div class="bg-purple-900 p-6 rounded-2xl w-full max-w-lg border border-purple-500 max-h-[90vh] overflow-y-auto">
            <h2 id="modal-titulo" class="text-xl font-bold mb-4 uppercase">Gestión</h2>
            <div id="campos-form" class="space-y-3"></div>
            <div id="lista-receta" class="space-y-2 mt-4"></div>
            
            <div id="seccion-resumen-qr" class="hidden text-center">
                <div id="qrcode" class="flex justify-center mb-4"></div>
                <div id="resumen-info" class="text-left text-xs bg-purple-950 p-3 rounded-lg mb-4"></div>
            </div>

            <div id="botones-accion" class="mt-6 flex gap-2">
                <button id="btn-accion" class="flex-1 bg-emerald-500 p-3 rounded-xl font-bold">CONFIRMAR</button>
                <button id="btn-eliminar" onclick="borrarInsumo()" class="hidden bg-red-600 px-4 rounded-xl font-bold">BORRAR</button>
                <button onclick="cerrarModal()" class="bg-purple-800 p-3 rounded-xl">CERRAR</button>
            </div>
        </div>
    </div>

    <script>
        // ... (firebaseConfig) ...
        let insumosLocales = [];
        let idEdicion = null;

        function renderLista() {
            const cont = document.getElementById('lista-insumos');
            cont.innerHTML = "";
            insumosLocales.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-4 rounded-xl border border-purple-700 cursor-pointer hover:border-purple-400";
                div.onclick = () => verFicha(item);
                div.innerHTML = `<h3 class="font-bold">${item.nombre}</h3><p class="text-sm">Stock: ${item.stock} ${item.unidad}</p>`;
                cont.appendChild(div);
            });
        }

        function verFicha(item) {
            idEdicion = item.id;
            abrirForm('nuevo');
            document.getElementById('ins-cat').value = item.categoria;
            document.getElementById('ins-nom').value = item.nombre;
            document.getElementById('ins-stock').value = item.stock;
            document.getElementById('btn-eliminar').classList.remove('hidden');
        }

        async function guardarInsumo() {
            const codigo = idEdicion || `${document.getElementById('ins-cat').value.substring(0,4).toUpperCase()}-${Date.now().toString().slice(-3)}`;
            const data = {
                categoria: document.getElementById('ins-cat').value,
                nombre: document.getElementById('ins-nom').value,
                stock: Number(document.getElementById('ins-stock').value),
                unidad: document.getElementById('ins-unidad').value
            };
            await db.collection("inventario").doc(codigo).set(data, {merge: true});
            
            // Mostrar Resumen y QR
            document.getElementById('campos-form').classList.add('hidden');
            document.getElementById('botones-accion').classList.add('hidden');
            const res = document.getElementById('seccion-resumen-qr');
            res.classList.remove('hidden');
            document.getElementById('resumen-info').innerHTML = `<b>Insumo:</b> ${data.nombre}<br><b>Stock:</b> ${data.stock} ${data.unidad}`;
            new QRCode(document.getElementById('qrcode'), codigo);
        }

        async function borrarInsumo() {
            if(confirm("¿Borrar definitivamente?")) {
                await db.collection("inventario").doc(idEdicion).delete();
                cerrarModal();
            }
        }

        function cerrarModal() { 
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('seccion-resumen-qr').classList.add('hidden');
            document.getElementById('campos-form').classList.remove('hidden');
            idEdicion = null;
        }
    </script>
</body>
</html>
