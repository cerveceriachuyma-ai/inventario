<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyma Bodega & Lab - Official v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased">

    <!-- VISTA LOGIN -->
    <div id="vista-login" class="flex flex-col items-center justify-center min-h-screen px-4">
        <div class="bg-gray-900 border border-amber-500/30 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h1 class="text-4xl font-black text-center text-amber-500 tracking-wider mb-1">CHUYMA</h1>
            <p class="text-gray-400 text-center text-xs uppercase tracking-widest mb-8">Bodega & Control de Laboratorio v3.0</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Contraseña</label>
                    <input type="password" id="login-password" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <button id="btn-login" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-black py-4 px-4 rounded-xl transition duration-200 mt-2 text-lg uppercase tracking-wide cursor-pointer">
                    Abrir Sistema
                </button>
                <p id="login-error" class="text-red-400 text-sm text-center font-semibold mt-2 hidden"></p>
            </div>
        </div>
    </div>

    <!-- VISTA APP -->
    <div id="vista-app" class="hidden min-h-screen flex flex-col">
        <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40">
            <div class="max-w-6xl w-full mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-amber-500 tracking-wide">CHUYMA BODEGA</h1>
                    <p class="text-xs text-gray-400 font-medium">Control de Insumos & Trazabilidad Operativa</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="btn-generar-reporte" class="bg-purple-900/40 hover:bg-purple-800/50 border border-purple-500/40 text-purple-300 font-bold px-3 py-2 rounded-xl text-xs uppercase tracking-wider transition">
                        📊 Reporte Bodega
                    </button>
                    <div id="alerta-status" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-800 text-xs font-bold border border-gray-700"></div>
                    <button id="btn-logout" class="bg-red-950/40 hover:bg-red-900/40 border border-red-800 text-red-300 font-bold px-3 py-2 rounded-xl text-xs uppercase tracking-wider transition">
                        Salir
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 p-4 max-w-6xl w-full mx-auto space-y-6">
            <!-- ACCIONES SUPERIORES -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="buscador" placeholder="🔍 Buscar por nombre, lote o código..." class="md:col-span-1 w-full bg-gray-900 border border-gray-800 rounded-xl p-4 text-white text-base focus:outline-none focus:border-amber-500 shadow-inner">
                <button id="btn-abrir-camara" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-black p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    📷 ESCANEAR QR
                </button>
                <button id="btn-nuevo-insumo" class="bg-gray-900 hover:bg-gray-850 text-amber-500 border border-amber-500/20 font-bold p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    📦 NUEVO INSUMO
                </button>
                <button id="btn-registrar-uso" class="bg-blue-900/30 hover:bg-blue-800/40 text-blue-400 border border-blue-500/30 font-bold p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    🧪 REGISTRAR USO
                </button>
            </div>

            <!-- CONTENEDOR CÁMARA -->
            <div id="contenedor-camara" class="hidden bg-black p-4 rounded-2xl border border-amber-500 max-w-md mx-auto relative shadow-2xl">
                <div id="lector-qr" class="w-full overflow-hidden rounded-xl"></div>
                <button id="btn-cerrar-camara" class="w-full bg-red-600 hover:bg-red-700 text-white font-black p-3 rounded-xl mt-3 text-xs uppercase tracking-wider transition cursor-pointer">
                    Apagar Cámara
                </button>
            </div>

            <!-- PESTAÑAS FILTRO -->
            <div class="flex gap-1 overflow-x-auto pb-2 border-b border-gray-800 no-scrollbar">
                <button onclick="filtrarPorPestana('todas')" id="tab-todas" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-amber-500 text-gray-950 shadow">Todas</button>
                <button onclick="filtrarPorPestana('malta')" id="tab-malta" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Maltas</button>
                <button onclick="filtrarPorPestana('lupulo')" id="tab-lupulo" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Lúpulos</button>
                <button onclick="filtrarPorPestana('clarificante')" id="tab-clarificante" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Clarificantes</button>
                <button onclick="filtrarPorPestana('laboratorio')" id="tab-laboratorio" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Laboratorio</button>
                <button onclick="filtrarPorPestana('levadura')" id="tab-levadura" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Levaduras</button>
                <button onclick="filtrarPorPestana('limpieza')" id="tab-limpieza" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Limpieza</button>
                <button onclick="filtrarPorPestana('empaque')" id="tab-empaque" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Secos / Gas</button>
            </div>

            <!-- CUADRÍCULA DE INSUMOS -->
            <div id="lista-insumos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <!-- FORMULARIO FICHA TÉCNICA -->
            <div id="form-insumo" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-6 shadow-2xl relative max-w-4xl mx-auto">
                <h2 id="form-titulo" class="text-2xl font-black text-amber-500 border-b border-gray-800 pb-3 uppercase">Ficha Técnica de Insumo</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Categoría General</label>
                                <select id="insumo-categoria" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-amber-500">
                                    <option value="malta">Maltas</option>
                                    <option value="lupulo">Lúpulos</option>
                                    <option value="clarificante">Clarificantes</option>
                                    <option value="laboratorio">Laboratorio</option>
                                    <option value="levadura">Microbiología (Levaduras)</option>
                                    <option value="limpieza">Limpieza e Higiene</option>
                                    <option value="empaque">Insumos Secos y Gases</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Nombre / Identificación</label>
                                <input type="text" id="insumo-nombre" placeholder="Ej: Malta Pale Ale" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <!-- STOCK, UNIDAD, MINIMO Y COSTO -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cant. Actual</label>
                                <input type="number" step="any" id="insumo-stock" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Unidad</label>
                                <select id="insumo-unidad" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500 text-center">
                                    <option value="kg">kg</option>
                                    <option value="g">g</option>
                                    <option value="mL">mL</option>
                                    <option value="litros">litros</option>
                                    <option value="unidades">unidades</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cant. Mínima</label>
                                <input type="number" step="any" id="insumo-minimo" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-amber-400 mb-1">Costo Unit. (CLP)</label>
                                <input type="number" step="any" id="insumo-costo" placeholder="$ 0" class="w-full bg-gray-800 border border-amber-500/50 rounded-xl p-3 text-amber-300 font-bold text-center focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <!-- COMPRA Y DOCUMENTO -->
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Proveedor</label>
                                <input type="text" id="insumo-proveedor" placeholder="Ej: Hopsteiner" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Tipo Doc.</label>
                                <select id="insumo-tipo-documento" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500 text-center">
                                    <option value="Boleta">Boleta</option>
                                    <option value="Factura">Factura</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">N° Documento</label>
                                <input type="text" id="insumo-documento" placeholder="N° Doc" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <!-- FECHAS DE TRAZABILIDAD Y EXPIRACIÓN -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-gray-950 p-3 rounded-xl border border-gray-800">
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Lote Trazab.</label>
                                <input type="text" id="insumo-lote" placeholder="S/L" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Fecha Ingreso</label>
                                <input type="date" id="insumo-fecha-ingreso" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Días Críticos (Bodega)</label>
                                <input type="number" id="insumo-dias-criticos" placeholder="Ej: 180" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-red-400 mb-1">Fecha Expiración 📅</label>
                                <input type="date" id="insumo-fecha-expiracion" class="w-full bg-gray-800 border border-red-900/50 rounded-xl p-2.5 text-xs text-red-300 font-bold text-center focus:outline-none focus:border-red-500">
                            </div>
                        </div>

                        <!-- CÓDIGO TIPO APP -->
                        <div class="bg-gray-850 p-3 rounded-xl border border-gray-700">
                            <label class="block text-xs font-bold uppercase text-amber-500 mb-0.5">Código Único de Trazabilidad</label>
                            <input type="text" id="insumo-codigo-unico" readonly placeholder="Se generará automáticamente" class="w-full bg-transparent text-sm text-gray-300 font-mono font-bold focus:outline-none">
                        </div>

                        <div id="campos-dinamicos" class="bg-gray-950 p-4 rounded-xl border border-gray-800 grid grid-cols-1 sm:grid-cols-2 gap-3 min-h-[60px] items-center"></div>
                    </div>

                    <!-- SECCIÓN QR -->
                    <div class="bg-gray-950 p-4 rounded-2xl border border-gray-800 flex flex-col items-center justify-center text-center min-h-[220px]">
                        <span class="text-xs font-bold text-gray-500 uppercase mb-3">Trazabilidad QR Física</span>
                        <div id="qrcode-container" class="bg-white p-3 rounded-xl inline-block shadow-lg"></div>
                        <button id="btn-imprimir-qr" class="w-full bg-gray-800 hover:bg-gray-750 text-amber-500 font-bold text-xs py-2.5 rounded-xl mt-4 border border-amber-500/10 transition cursor-pointer">
                            🖨️ IMPRIMIR ETIQUETA QR
                        </button>
                    </div>
                </div>

                <!-- CONTROLES -->
                <div class="flex flex-col sm:flex-row gap-4 justify-between border-t border-gray-800 pt-4">
                    <button id="btn-eliminar" class="hidden bg-red-950/40 hover:bg-red-900/50 border border-red-800 text-red-400 font-bold px-5 py-3 rounded-xl transition cursor-pointer uppercase text-xs tracking-wider">
                        🗑️ Eliminar Insumo
                    </button>
                    <div class="flex gap-3 justify-end items-center w-full sm:w-auto">
                        <p id="form-error" class="text-red-400 text-sm font-semibold hidden"></p>
                        <button id="btn-cancelar" class="bg-gray-750 text-gray-400 font-bold px-5 py-3 rounded-xl hover:bg-gray-700 transition cursor-pointer">Cancelar</button>
                        <button id="btn-guardar-solicitar-pin" class="bg-amber-500 text-gray-950 font-black px-8 py-3 rounded-xl hover:bg-amber-600 transition uppercase text-sm cursor-pointer">
                            🔒 Guardar Ficha
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL CONFIRMACIÓN DE SEGURIDAD (PIN / PASSWORD) -->
    <div id="modal-seguridad" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-amber-500/40 p-6 rounded-2xl max-w-md w-full shadow-2xl space-y-4">
            <h3 class="text-xl font-black text-amber-500 uppercase border-b border-gray-800 pb-2">🔒 Autorizar Modificación</h3>
            <p class="text-xs text-gray-300">Ingresa tu contraseña de usuario para confirmar y guardar los cambios en Firebase:</p>
            <input type="password" id="pin-autorizacion" placeholder="Contraseña de usuario" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-center font-bold">
            <p id="pin-error" class="text-red-400 text-xs font-semibold hidden text-center"></p>
            <div class="flex gap-3 justify-end pt-2">
                <button id="btn-cancelar-pin" class="bg-gray-800 text-gray-400 font-bold px-4 py-2.5 rounded-xl text-xs uppercase">Cancelar</button>
                <button id="btn-confirmar-pin" class="bg-amber-500 text-gray-950 font-black px-6 py-2.5 rounded-xl text-xs uppercase">Confirmar y Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE REPORTE DE BODEGA -->
    <div id="modal-reporte" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-purple-500/40 p-6 rounded-2xl max-w-4xl w-full shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-xl font-black text-purple-400 uppercase">📊 Reporte Valorizado de Bodega</h3>
                <button id="btn-cerrar-reporte" class="text-gray-400 hover:text-white font-bold">✕</button>
            </div>
            <div id="contenido-reporte" class="overflow-y-auto flex-1 space-y-4 pr-2">
                <!-- Se llena dinámicamente -->
            </div>
            <div class="flex justify-end gap-3 border-t border-gray-800 pt-3">
                <button id="btn-exportar-csv" class="bg-green-700 hover:bg-green-600 text-white font-bold px-4 py-2 rounded-xl text-xs uppercase">Descargar CSV / Excel</button>
                <button id="btn-imprimir-reporte" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl text-xs uppercase">Imprimir Reporte</button>
            </div>
        </div>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBSaIzbcFiyTF1zy9_9Z97ZSPfL322xO24",
            authDomain: "inventariochuyma-da052.firebaseapp.com",
            projectId: "inventariochuyma-da052",
            storageBucket: "inventariochuyma-da052.firebasestorage.app",
            messagingSenderId: "677439195293",
            appId: "1:677439195293:web:50b624de9e0c877c89ec74"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        var insumosLocales = [];
        var idInsumoSeleccionado = null;
        var pestanaActual = "todas";

        var vistaLogin = document.getElementById('vista-login');
        var vistaApp = document.getElementById('vista-app');
        var errorTxt = document.getElementById('login-error');
        var buscador = document.getElementById('buscador');
        var listaInsumos = document.getElementById('lista-insumos');
        var formInsumo = document.getElementById('form-insumo');
        var qrcodeContainer = document.getElementById('qrcode-container');
        var camposDinamicos = document.getElementById('campos-dinamicos');
        var formError = document.getElementById('form-error');
        var btnEliminar = document.getElementById('btn-eliminar');

        document.getElementById('btn-login').addEventListener('click', function(e) {
            e.preventDefault();
            errorTxt.classList.add('hidden');
            var email = document.getElementById('login-email').value.trim();
            var pass = document.getElementById('login-password').value.trim();
            if(!email || !pass) return;
            
            auth.signInWithEmailAndPassword(email, pass)
                .catch(function(error) {
                    errorTxt.textContent = "Credenciales incorrectas.";
                    errorTxt.classList.remove('hidden');
                });
        });

        document.getElementById('btn-logout').addEventListener('click', function() { auth.signOut(); });

        auth.onAuthStateChanged(function(user) {
            if (user) {
                vistaLogin.classList.add('hidden');
                vistaApp.classList.remove('hidden');
                db.collection("inventario").onSnapshot(function(snapshot) {
                    insumosLocales = [];
                    snapshot.forEach(function(doc) {
                        insumosLocales.push(Object.assign({ id: doc.id }, doc.data()));
                    });
                    evaluarAlertasYRender();
                }, function(error) { console.error("Error BD:", error); });
            } else {
                vistaLogin.classList.remove('hidden');
                vistaApp.classList.add('hidden');
            }
        });

        window.filtrarPorPestana = function(categoria) {
            pestanaActual = categoria;
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400";
            });
            document.getElementById('tab-' + categoria).className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-amber-500 text-gray-950 shadow";
            ejecutarFiltro();
        };

        function ejecutarFiltro() {
            var txt = buscador.value.toLowerCase();
            var filtrados = insumosLocales.filter(function(i) {
                var matchesTab = (pestanaActual === 'todas' || i.categoria === pestanaActual);
                var matchesTxt = (i.nombre && i.nombre.toLowerCase().includes(txt)) || 
                                 (i.lote && i.lote.toLowerCase().includes(txt)) ||
                                 (i.codigoUnico && i.codigoUnico.toLowerCase().includes(txt));
                return matchesTab && matchesTxt;
            });
            renderLista(filtrados);
        }

        buscador.addEventListener('input', ejecutarFiltro);

        function evaluarAlertasYRender() {
            var quiebreActivo = false;
            insumosLocales.forEach(function(item) {
                if (item.minimo && Number(item.stock) <= Number(item.minimo)) quiebreActivo = true;
            });
            var statusDiv = document.getElementById('alerta-status');
            if (quiebreActivo) {
                statusDiv.innerHTML = '<span class="w-2.5 h-2.5 bg-red-500 rounded-full inline-block animate-ping"></span> STOCK CRÍTICO';
                statusDiv.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-950/30 text-red-400 text-xs font-black border border-red-900/50";
            } else {
                statusDiv.innerHTML = '<span class="w-2.5 h-2.5 bg-green-400 rounded-full inline-block"></span> BODEGA OK';
                statusDiv.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-900 text-green-400 text-xs font-bold border border-gray-800";
            }
            ejecutarFiltro();
        }

        function renderLista(datos) {
            listaInsumos.innerHTML = "";
            if (datos.length === 0) {
                listaInsumos.innerHTML = `<div class="col-span-full text-center py-12 text-gray-600 font-medium text-sm">No hay registros cargados.</div>`;
                return;
            }

            var fHoy = new Date();

            datos.forEach(function(item) {
                var esCriticoStock = item.minimo && Number(item.stock) <= Number(item.minimo);
                var unidad = item.unidadMedida || 'unidades';

                // 1. CÁLCULO DÍAS EN BODEGA
                var badgeBodega = "";
                if (item.fechaIngreso) {
                    var fIngreso = new Date(item.fechaIngreso);
                    var diffDias = Math.floor((fHoy - fIngreso) / (1000 * 60 * 60 * 24));
                    var esExcesoBodega = item.diasCriticos && diffDias > Number(item.diasCriticos);
                    
                    badgeBodega = `
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold ${esExcesoBodega ? 'bg-purple-950 text-purple-300 border border-purple-700 animate-pulse' : 'bg-gray-800 text-gray-400'}">
                            📦 ${diffDias}d en bodega ${esExcesoBodega ? '⚠️' : ''}
                        </span>
                    `;
                }

                // 2. CÁLCULO FECHA DE EXPIRACIÓN
                var badgeExpiracion = "";
                if (item.fechaExpiracion) {
                    var fExp = new Date(item.fechaExpiracion);
                    var diffExp = Math.ceil((fExp - fHoy) / (1000 * 60 * 60 * 24));
                    
                    if (diffExp < 0) {
                        badgeExpiracion = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-black bg-red-950 text-red-400 border border-red-700 animate-ping">🚨 VENCIDO (${Math.abs(diffExp)}d)</span>`;
                    } else if (diffExp <= 30) {
                        badgeExpiracion = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-700">📅 Vence en ${diffExp}d</span>`;
                    } else {
                        badgeExpiracion = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-green-950 text-green-400 border border-green-800">📅 Vence: ${item.fechaExpiracion}</span>`;
                    }
                }

                var card = document.createElement('div');
                card.className = `bg-gray-900 p-5 rounded-2xl border transition shadow-lg flex flex-col justify-between ${esCriticoStock ? 'border-red-600/60 shadow-red-950/10' : 'border-gray-850 hover:border-gray-800'}`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-black text-white text-base truncate w-full">${item.nombre}</h3>
                            <span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded bg-gray-850 text-amber-500">${item.categoria}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Cód: <span class="text-amber-500 font-mono font-bold">${item.codigoUnico || 'S/C'}</span> | Lote: <span class="text-gray-300">${item.lote || 'S/L'}</span></p>
                        
                        <div class="flex flex-wrap gap-1.5 mt-3">
                            ${badgeBodega}
                            ${badgeExpiracion}
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-850 pt-3 mt-4">
                        <div class="flex items-center gap-1.5">
                            <button onclick="cambiarStock('${item.id}', -1)" class="bg-gray-800 hover:bg-gray-700 text-white w-9 h-9 rounded-xl font-black text-lg cursor-pointer">-</button>
                            <div class="text-center min-w-[50px]">
                                <span class="font-black text-lg text-white block">${item.stock}</span>
                                <span class="text-[8px] text-gray-500 uppercase font-bold block -mt-1">${unidad}</span>
                            </div>
                            <button onclick="cambiarStock('${item.id}', 1)" class="bg-gray-800 hover:bg-gray-700 text-white w-9 h-9 rounded-xl font-black text-lg cursor-pointer">+</button>
                        </div>
                        <button onclick="verFicha('${item.id}')" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-black px-3.5 py-2 rounded-xl text-xs uppercase cursor-pointer">Ficha / Editar</button>
                    </div>
                `;
                listaInsumos.appendChild(card);
            });
        }

        window.cambiarStock = function(id, cambio) {
            var item = insumosLocales.find(function(i) { return i.id === id; });
            if(item) {
                var nuevoStock = Math.max(0, Number(item.stock) + cambio);
                db.collection("inventario").doc(id).update({ stock: nuevoStock });
            }
        };

        window.verFicha = function(id) {
            idInsumoSeleccionado = id;
            var item = insumosLocales.find(function(i) { return i.id === id; });
            if(!item) return;
            
            formError.classList.add('hidden');
            btnEliminar.classList.remove('hidden');
            
            document.getElementById('form-titulo').textContent = "Ficha Técnica e Historial";
            document.getElementById('insumo-categoria').value = item.categoria;
            document.getElementById('insumo-nombre').value = item.nombre;
            document.getElementById('insumo-stock').value = item.stock;
            document.getElementById('insumo-unidad').value = item.unidadMedida || 'kg';
            document.getElementById('insumo-minimo').value = item.minimo || "";
            document.getElementById('insumo-costo').value = item.costoUnidad || "";
            document.getElementById('insumo-lote').value = item.lote || '';
            document.getElementById('insumo-tipo-documento').value = item.tipoDocumento || 'Boleta';
            document.getElementById('insumo-documento').value = item.documentoCompra || '';
            document.getElementById('insumo-proveedor').value = item.proveedor || '';
            document.getElementById('insumo-fecha-ingreso').value = item.fechaIngreso || '';
            document.getElementById('insumo-dias-criticos').value = item.diasCriticos || '';
            document.getElementById('insumo-fecha-expiracion').value = item.fechaExpiracion || '';
            document.getElementById('insumo-codigo-unico').value = item.codigoUnico || 'No asignado';
            
            qrcodeContainer.innerHTML = "";
            new QRCode(qrcodeContainer, { text: item.codigoUnico || id, width: 110, height: 110 });
            formInsumo.classList.remove('hidden');
            formInsumo.scrollIntoView({ behavior: 'smooth' });
        };

        document.getElementById('btn-nuevo-insumo').addEventListener('click', function() {
            idInsumoSeleccionado = null;
            formError.classList.add('hidden');
            btnEliminar.classList.add('hidden');
            
            document.getElementById('form-titulo').textContent = "Nuevo Insumo";
            document.getElementById('insumo-nombre').value = "";
            document.getElementById('insumo-stock').value = "";
            document.getElementById('insumo-minimo').value = "";
            document.getElementById('insumo-costo').value = "";
            document.getElementById('insumo-lote').value = "";
            document.getElementById('insumo-documento').value = "";
            document.getElementById('insumo-proveedor').value = "";
            document.getElementById('insumo-codigo-unico').value = "";
            document.getElementById('insumo-fecha-ingreso').value = new Date().toISOString().split('T')[0];
            document.getElementById('insumo-dias-criticos').value = "";
            document.getElementById('insumo-fecha-expiracion').value = "";

            qrcodeContainer.innerHTML = "<p class='text-[10px] text-gray-500 p-2 font-bold uppercase'>Se creará al guardar</p>";
            formInsumo.classList.remove('hidden');
            formInsumo.scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('btn-cancelar').addEventListener('click', function() { formInsumo.classList.add('hidden'); });

        // SEGURIDAD: SOLICITUD DE CONFIRMACIÓN POR PIN/PASSWORD
        document.getElementById('btn-guardar-solicitar-pin').addEventListener('click', function() {
            var nombreVal = document.getElementById('insumo-nombre').value.trim();
            if (!nombreVal) {
                formError.textContent = "El nombre es obligatorio.";
                formError.classList.remove('hidden');
                return;
            }
            document.getElementById('modal-seguridad').classList.remove('hidden');
            document.getElementById('pin-autorizacion').value = "";
            document.getElementById('pin-error').classList.add('hidden');
        });

        document.getElementById('btn-cancelar-pin').addEventListener('click', function() {
            document.getElementById('modal-seguridad').classList.add('hidden');
        });

        document.getElementById('btn-confirmar-pin').addEventListener('click', function() {
            var pass = document.getElementById('pin-autorizacion').value.trim();
            var user = auth.currentUser;

            if (!pass || !user) return;

            // Re-autenticación de seguridad para autorizar la escritura
            var credential = firebase.auth.EmailAuthProvider.credential(user.email, pass);
            user.reauthenticateWithCredential(credential)
                .then(function() {
                    document.getElementById('modal-seguridad').classList.add('hidden');
                    ejecutarGuardadoInsumo();
                })
                .catch(function(err) {
                    document.getElementById('pin-error').textContent = "Contraseña de autorización incorrecta.";
                    document.getElementById('pin-error').classList.remove('hidden');
                });
        });

        function ejecutarGuardadoInsumo() {
            var payload = {
                categoria: document.getElementById('insumo-categoria').value,
                nombre: document.getElementById('insumo-nombre').value.trim(),
                stock: Number(document.getElementById('insumo-stock').value) || 0,
                unidadMedida: document.getElementById('insumo-unidad').value,
                minimo: Number(document.getElementById('insumo-minimo').value) || 0,
                costoUnidad: Number(document.getElementById('insumo-costo').value) || 0,
                lote: document.getElementById('insumo-lote').value.trim() || 'S/L',
                tipoDocumento: document.getElementById('insumo-tipo-documento').value,
                documentoCompra: document.getElementById('insumo-documento').value.trim() || '',
                proveedor: document.getElementById('insumo-proveedor').value.trim() || '',
                fechaIngreso: document.getElementById('insumo-fecha-ingreso').value || '',
                diasCriticos: Number(document.getElementById('insumo-dias-criticos').value) || 0,
                fechaExpiracion: document.getElementById('insumo-fecha-expiracion').value || ''
            };

            if (idInsumoSeleccionado) {
                db.collection("inventario").doc(idInsumoSeleccionado).update(payload)
                .then(function() { formInsumo.classList.add('hidden'); });
            } else {
                var nuevaRef = db.collection("inventario").doc();
                var prefijo = payload.nombre.replace(/[^a-zA-Z0-9]/g, '').substring(0, 4).toUpperCase();
                payload.codigoUnico = (prefijo || "INS") + "-" + Math.floor(1000 + Math.random() * 9000);

                nuevaRef.set(payload).then(function() { formInsumo.classList.add('hidden'); });
            }
        }

        // MODAL DE REPORTES Y VALORIZACIÓN
        document.getElementById('btn-generar-reporte').addEventListener('click', function() {
            var cont = document.getElementById('contenido-reporte');
            cont.innerHTML = "";
            
            var totalValoriz = 0;
            var insumosVencidos = 0;
            
            var htmlTabla = `
                <table class="w-full text-xs text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800 text-amber-500 border-b border-gray-700">
                            <th class="p-2">Cód</th>
                            <th class="p-2">Nombre</th>
                            <th class="p-2">Stock</th>
                            <th class="p-2">Costo Unit</th>
                            <th class="p-2">Subtotal</th>
                            <th class="p-2">Expiración</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            insumosLocales.forEach(function(i) {
                var costo = Number(i.costoUnidad) || 0;
                var subtotal = (Number(i.stock) || 0) * costo;
                totalValoriz += subtotal;

                htmlTabla += `
                    <tr class="border-b border-gray-800 hover:bg-gray-850">
                        <td class="p-2 font-mono font-bold text-amber-500">${i.codigoUnico || 'S/C'}</td>
                        <td class="p-2 font-bold">${i.nombre}</td>
                        <td class="p-2">${i.stock} ${i.unidadMedida || ''}</td>
                        <td class="p-2">$ ${costo.toLocaleString('es-CL')}</td>
                        <td class="p-2 font-bold text-green-400">$ ${subtotal.toLocaleString('es-CL')}</td>
                        <td class="p-2 text-gray-400">${i.fechaExpiracion || 'N/R'}</td>
                    </tr>
                `;
            });

            htmlTabla += `</tbody></table>`;

            cont.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div class="bg-gray-800 p-4 rounded-xl border border-purple-500/30">
                        <span class="text-xs uppercase text-gray-400 font-bold block">Valor Total de Inventario</span>
                        <span class="text-2xl font-black text-green-400">$ ${totalValoriz.toLocaleString('es-CL')} CLP</span>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-purple-500/30">
                        <span class="text-xs uppercase text-gray-400 font-bold block">Total Insumos Registrados</span>
                        <span class="text-2xl font-black text-amber-500">${insumosLocales.length} Ítems</span>
                    </div>
                </div>
                ${htmlTabla}
            `;

            document.getElementById('modal-reporte').classList.remove('hidden');
        });

        document.getElementById('btn-cerrar-reporte').addEventListener('click', function() {
            document.getElementById('modal-reporte').classList.add('hidden');
        });
    </script>
</body>
</html>
