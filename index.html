<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUYMA BODEGA - Trazabilidad Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- ESTRUCTURA DE APP SIMPLIFICADA -->
    <div id="vista-app" class="hidden p-4 max-w-4xl mx-auto">
        <h1 class="text-2xl font-black text-amber-500 mb-6">BODEGA CHUYMA</h1>
        <div id="lista-insumos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- FORMULARIO DE FICHA Y CONSUMO -->
    <div id="form-insumo" class="hidden fixed inset-0 bg-black/90 p-4 flex items-center justify-center z-50 overflow-y-auto">
        <div class="bg-gray-800 p-6 rounded-2xl w-full max-w-lg border border-gray-700">
            <h2 id="form-titulo" class="text-xl font-black text-amber-500 mb-4">Ficha Técnica</h2>
            
            <div class="space-y-3">
                <input type="text" id="insumo-nombre" placeholder="Nombre" class="w-full p-3 bg-gray-900 rounded-xl">
                <input type="date" id="insumo-fecha-ingreso" class="w-full p-3 bg-gray-900 rounded-xl">
                <input type="text" id="insumo-documento" placeholder="N° Factura" class="w-full p-3 bg-gray-900 rounded-xl">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="insumo-stock" placeholder="Stock" class="w-full p-3 bg-gray-900 rounded-xl">
                    <select id="insumo-unidad" class="w-full p-3 bg-gray-900 rounded-xl"><option value="kg">kg</option><option value="g">g</option></select>
                </div>
            </div>

            <!-- SECCIÓN CONSUMO -->
            <div class="mt-6 border-t border-gray-700 pt-4">
                <h3 class="text-amber-500 font-bold mb-2">Registrar Consumo (Salida)</h3>
                <input type="text" id="bf-lote" placeholder="Lote Brewfather" class="w-full p-3 bg-gray-900 rounded-xl mb-2">
                <button id="btn-consumir" class="w-full bg-red-800 text-white font-black p-3 rounded-xl">CONFIRMAR SALIDA DE BODEGA</button>
            </div>
            
            <div class="mt-6 flex gap-2">
                <button id="btn-guardar" class="flex-1 bg-amber-500 text-black font-black p-3 rounded-xl">GUARDAR FICHA</button>
                <button id="btn-cancelar" class="bg-gray-700 px-4 rounded-xl">X</button>
            </div>
        </div>
    </div>

    <script>
        var firebaseConfig = { /* TUS DATOS AQUÍ */ };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // LOGICA DE CONSUMO (SALIDA)
        document.getElementById('btn-consumir').addEventListener('click', () => {
            const loteBF = document.getElementById('bf-lote').value;
            if(!loteBF) { alert("¡Falta el lote de Brewfather!"); return; }
            
            const ref = db.collection("inventario").doc(idInsumoSeleccionado);
            db.runTransaction(async (t) => {
                const doc = await t.get(ref);
                const nuevoStock = doc.data().stock - 1; // Ajusta según tu necesidad
                t.update(ref, { 
                    stock: nuevoStock,
                    historialSalidas: firebase.firestore.FieldValue.arrayUnion({
                        fecha: new Date().toLocaleString(),
                        loteBF: loteBF
                    })
                });
            }).then(() => alert("Salida registrada con éxito."));
        });

        window.generarReporte = () => {
            let csv = "Nombre,Stock,Fecha Ingreso,Factura,Historial Salidas (Fecha | LoteBF)\n";
            insumosLocales.forEach(i => {
                const historial = i.historialSalidas ? i.historialSalidas.map(s => `${s.fecha} | ${s.loteBF}`).join("; ") : "Sin salidas";
                csv += `${i.nombre},${i.stock},${i.fechaIngreso},${i.documento},"${historial}"\n`;
            });
            // ... (resto de la lógica de descarga)
        };
    </script>
</body>
</html>
