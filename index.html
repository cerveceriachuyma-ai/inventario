<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chuyma Bodega & Lab - v2.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- ... resto de tus scripts (qr, etc) ... -->
</head>
<body class="bg-gray-900 text-gray-100">

<!-- FORMULARIO DE INGRESO ACTUALIZADO -->
<div id="form-insumo" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4">
    <h2 id="form-titulo" class="text-amber-500 font-black text-xl">Ficha Técnica</h2>
    
    <!-- NUEVOS CAMPOS -->
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="text-[10px] uppercase font-bold text-gray-400">Fecha Ingreso</label>
            <input type="date" id="insumo-fecha-ingreso" class="w-full bg-gray-800 rounded-xl p-2 text-white">
        </div>
        <div>
            <label class="text-[10px] uppercase font-bold text-gray-400">N° Factura/Boleta</label>
            <input type="text" id="insumo-documento" placeholder="Ej: FA-1234" class="w-full bg-gray-800 rounded-xl p-2 text-white">
        </div>
    </div>

    <!-- CAMPOS EXISTENTES (Lote ahora va después) -->
    <div>
        <label class="text-[10px] uppercase font-bold text-gray-400">Lote Trazabilidad</label>
        <input type="text" id="insumo-lote" class="w-full bg-gray-800 rounded-xl p-2 text-white">
    </div>

    <!-- CAMPO DE REGISTRO DE SALIDA (Para el modal de uso) -->
    <div id="seccion-salida" class="hidden border-t border-gray-800 pt-4 mt-4">
        <label class="text-[10px] uppercase font-bold text-gray-400">Registrar Salida (Uso en Brewfather)</label>
        <input type="text" id="brewfather-lote" placeholder="Lote Brewfather (Ej: B-001)" class="w-full bg-gray-800 rounded-xl p-2 mb-2">
        <button onclick="ejecutarSalida()" class="w-full bg-red-600 text-white font-bold py-2 rounded-xl">Confirmar Consumo</button>
    </div>
</div>

<script>
    // ... tu configuración de firebase ...

    // Función para registrar la salida con auditoría
    window.ejecutarSalida = function() {
        var loteBrew = document.getElementById('brewfather-lote').value;
        if (!loteBrew) { alert("Debes ingresar el lote de Brewfather"); return; }
        
        var fechaActual = new Date().toLocaleString();
        var itemRef = db.collection("inventario").doc(idInsumoSeleccionado);
        
        // Aquí restamos stock y guardamos el registro en una sub-colección llamada "historial"
        db.runTransaction(function(transaction) {
            return transaction.get(itemRef).then(function(doc) {
                var nuevoStock = Number(doc.data().stock) - 1;
                transaction.update(itemRef, { stock: nuevoStock });
                transaction.set(itemRef.collection("historial").doc(), {
                    fecha: fechaActual,
                    loteBrewfather: loteBrew,
                    cantidadRestada: 1
                });
            });
        }).then(function() {
            alert("Salida registrada correctamente");
            location.reload();
        });
    };
</script>
</body>
</html>
