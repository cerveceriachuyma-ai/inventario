<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BODEGA CHUYMA - Control Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-4">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-black mb-6 text-purple-400">BODEGA CHUYMA</h1>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button onclick="abrirForm('nuevo')" class="bg-emerald-600 p-4 rounded-xl font-bold">📦 NUEVO INSUMO</button>
            <button onclick="abrirForm('consumo')" class="bg-rose-600 p-4 rounded-xl font-bold">📤 CONSUMO RECETA</button>
        </div>
        <div id="lista-insumos" class="space-y-4"></div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
        <div class="bg-purple-900 p-6 rounded-2xl w-full max-w-lg border border-purple-500">
            <h2 id="modal-titulo" class="text-xl font-bold mb-4 uppercase">Gestión</h2>
            <div id="campos-form" class="space-y-3"></div>
            <div id="lista-receta" class="space-y-2 mt-4"></div>
            
            <div class="mt-6 flex gap-2">
                <button id="btn-accion" class="flex-1 bg-emerald-500 p-3 rounded-xl font-bold">CONFIRMAR</button>
                <button onclick="cerrarModal()" class="bg-purple-800 p-3 rounded-xl">CERRAR</button>
            </div>
        </div>
    </div>

    <script>
        // ... (Aquí iría tu configuración de Firebase) ...
        
        function renderLista() {
            const container = document.getElementById('lista-insumos');
            container.innerHTML = "";
            insumosLocales.forEach(item => {
                const dias = Math.floor((new Date() - new Date(item.fechaIngreso)) / 86400000);
                const alerta = (item.stock <= item.stockMinimo || dias > item.diasMax);
                
                container.innerHTML += `
                    <div class="p-4 rounded-xl border ${alerta ? 'border-amber-500 bg-amber-950/20' : 'border-purple-700'}">
                        <h3 class="font-bold">${item.nombre}</h3>
                        <p class="text-sm">Stock: ${item.stock} ${item.unidad} ${item.stock <= item.stockMinimo ? '⚠️' : ''}</p>
                        <p class="text-xs">Permanencia: ${dias}/${item.diasMax} días</p>
                    </div>`;
            });
        }

        function abrirForm(tipo) {
            document.getElementById('modal').classList.remove('hidden');
            const campos = document.getElementById('campos-form');
            campos.innerHTML = "";
            
            if(tipo === 'nuevo') {
                document.getElementById('modal-titulo').textContent = "Nuevo Insumo";
                campos.innerHTML = `
                    <select id="ins-cat" class="w-full p-2 bg-purple-950 rounded-lg"><option value="malta">Malta</option><option value="lupulo">Lúpulo</option></select>
                    <input type="text" id="ins-nom" placeholder="Nombre" class="w-full p-2 bg-purple-950 rounded-lg">
                    <input type="date" id="ins-fecha" class="w-full p-2 bg-purple-950 rounded-lg">
                    <input type="number" id="ins-stock" placeholder="Stock" class="w-full p-2 bg-purple-950 rounded-lg">
                    <input type="number" id="ins-min" placeholder="Stock Mínimo" class="w-full p-2 bg-purple-950 rounded-lg">
                    <input type="text" id="ins-doc" placeholder="Factura/Boleta" class="w-full p-2 bg-purple-950 rounded-lg">
                    <input type="number" id="ins-dias" placeholder="Días Máx." class="w-full p-2 bg-purple-950 rounded-lg">
                `;
                document.getElementById('btn-accion').onclick = guardarInsumo;
            } else {
                document.getElementById('modal-titulo').textContent = "Consumo Receta";
                campos.innerHTML = `<button onclick="agregarFila()" class="w-full border border-dashed p-2 mb-2">+ Agregar Insumo</button>`;
                document.getElementById('btn-accion').onclick = procesarConsumoMasivo;
            }
        }

        function agregarFila() {
            const div = document.createElement('div');
            div.className = "flex gap-2 mb-2";
            div.innerHTML = `
                <select class="sel-id p-2 bg-purple-950 flex-1">${insumosLocales.map(i => `<option value="${i.id}">${i.nombre}</option>`).join('')}</select>
                <input type="number" class="sel-cant w-20 p-2 bg-purple-950" placeholder="Cant">
            `;
            document.getElementById('lista-receta').appendChild(div);
        }

        async function procesarConsumoMasivo() {
            const filas = document.querySelectorAll('#lista-receta > div');
            const batch = db.batch();
            filas.forEach(f => {
                const id = f.querySelector('.sel-id').value;
                const cant = Number(f.querySelector('.sel-cant').value);
                batch.update(db.collection("inventario").doc(id), { stock: firebase.firestore.FieldValue.increment(-cant) });
            });
            await batch.commit();
            cerrarModal();
            renderLista();
        }

        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('lista-receta').innerHTML = ""; }
    </script>
</body>
</html>
