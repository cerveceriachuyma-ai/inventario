<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyma Bodega & Lab - Official v2.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased">

    <!-- VISTA LOGIN -->
    <div id="vista-login" class="flex flex-col items-center justify-center min-h-screen px-4">
        <div class="bg-gray-900 border border-amber-500/30 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h1 class="text-4xl font-black text-center text-amber-500 tracking-wider mb-1">CHUYMA</h1>
            <p class="text-gray-400 text-center text-xs uppercase tracking-widest mb-8">Bodega & Control de Laboratorio</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Contraseña</label>
                    <input type="password" id="login-password" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <button id="btn-login" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-black py-4 px-4 rounded-xl transition duration-200 mt-2 text-lg uppercase tracking-wide cursor-pointer">
                    Abrir Sistema
                </button>
                <p id="login-error" class="text-red-400 text-sm text-center font-semibold mt-2 hidden"></p>
            </div>
        </div>
    </div>

    <!-- VISTA APP -->
    <div id="vista-app" class="hidden min-h-screen flex flex-col">
        <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40">
            <div class="max-w-6xl w-full mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-amber-500 tracking-wide">CHUYMA BODEGA</h1>
                    <p class="text-xs text-gray-400 font-medium">Panel de Trazabilidad Operativa</p>
                </div>
                <div class="flex items-center gap-4">
                    <div id="alerta-status" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-800 text-xs font-bold border border-gray-700"></div>
                    <button id="btn-logout" class="bg-red-950/40 hover:bg-red-900/40 border border-red-800 text-red-300 font-bold px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">
                        Salir
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 p-4 max-w-6xl w-full mx-auto space-y-6">
            <!-- ACCIONES SUPERIORES -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="buscador" placeholder="🔍 Buscar por nombre, lote o código único..." class="md:col-span-1 w-full bg-gray-900 border border-gray-800 rounded-xl p-4 text-white text-base focus:outline-none focus:border-amber-500 shadow-inner">
                <button id="btn-abrir-camara" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-black p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    📷 ESCANEAR QR
                </button>
                <button id="btn-nuevo-insumo" class="bg-gray-900 hover:bg-gray-850 text-amber-500 border border-amber-500/20 font-bold p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    📦 NUEVO INSUMO
                </button>
                <button id="btn-registrar-uso" class="bg-blue-900/30 hover:bg-blue-800/40 text-blue-400 border border-blue-500/30 font-bold p-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm uppercase tracking-wider transition cursor-pointer">
                    🧪 REGISTRAR USO
                </button>
            </div>

            <!-- CONTENEDOR CÁMARA -->
            <div id="contenedor-camara" class="hidden bg-black p-4 rounded-2xl border border-amber-500 max-w-md mx-auto relative shadow-2xl">
                <div id="lector-qr" class="w-full overflow-hidden rounded-xl"></div>
                <button id="btn-cerrar-camara" class="w-full bg-red-600 hover:bg-red-700 text-white font-black p-3 rounded-xl mt-3 text-xs uppercase tracking-wider transition cursor-pointer">
                    Apagar Cámara
                </button>
            </div>

            <!-- PESTAÑAS FILTRO -->
            <div class="flex gap-1 overflow-x-auto pb-2 border-b border-gray-800 no-scrollbar">
                <button onclick="filtrarPorPestana('todas')" id="tab-todas" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-amber-500 text-gray-950 shadow">Todas</button>
                <button onclick="filtrarPorPestana('malta')" id="tab-malta" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Maltas</button>
                <button onclick="filtrarPorPestana('lupulo')" id="tab-lupulo" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Lúpulos</button>
                <button onclick="filtrarPorPestana('clarificante')" id="tab-clarificante" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Clarificantes</button>
                <button onclick="filtrarPorPestana('laboratorio')" id="tab-laboratorio" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Laboratorio</button>
                <button onclick="filtrarPorPestana('levadura')" id="tab-levadura" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Levaduras</button>
                <button onclick="filtrarPorPestana('limpieza')" id="tab-limpieza" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Limpieza</button>
                <button onclick="filtrarPorPestana('empaque')" id="tab-empaque" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400">Insumos Secos / Gas</button>
            </div>

            <!-- CUADRÍCULA DE INSUMOS -->
            <div id="lista-insumos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <!-- FORMULARIO REGISTRO DE USO -->
            <div id="form-uso" class="hidden bg-gray-900 p-6 rounded-2xl border border-blue-800 space-y-6 shadow-2xl relative max-w-2xl mx-auto">
                <h2 class="text-2xl font-black text-blue-400 border-b border-gray-800 pb-3 uppercase">Registrar Consumo / Despacho</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Seleccionar Insumo Existente</label>
                        <select id="uso-insumo-id" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-blue-500">
                            <!-- Se llena dinámicamente -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cantidad a Utilizar</label>
                        <input type="number" step="any" id="uso-cantidad" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Fecha de Consumo</label>
                        <input type="date" id="uso-fecha" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Lote en Brewfather / Notas</label>
                        <input type="text" id="uso-lote-brewfather" placeholder="Ej: Batch #045 - Pale Ale" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="flex gap-3 justify-end border-t border-gray-800 pt-4">
                    <button id="btn-cancelar-uso" class="bg-gray-750 text-gray-400 font-bold px-5 py-3 rounded-xl hover:bg-gray-700 transition cursor-pointer">Cancelar</button>
                    <button id="btn-guardar-uso" class="bg-blue-600 text-white font-black px-8 py-3 rounded-xl hover:bg-blue-700 transition uppercase text-sm cursor-pointer">Registrar en Bitácora</button>
                </div>
                <p id="uso-error" class="text-red-400 text-sm font-semibold hidden"></p>
            </div>

            <!-- FORMULARIO / FICHA TÉCNICA -->
            <div id="form-insumo" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-6 shadow-2xl relative max-w-4xl mx-auto">
                <h2 id="form-titulo" class="text-2xl font-black text-amber-500 border-b border-gray-800 pb-3 uppercase">Ficha Técnica</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Categoría General</label>
                                <select id="insumo-categoria" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-amber-500">
                                    <option value="malta">Maltas</option>
                                    <option value="lupulo">Lúpulos</option>
                                    <option value="clarificante">Clarificantes</option>
                                    <option value="laboratorio">Laboratorio</option>
                                    <option value="levadura">Microbiología (Levaduras)</option>
                                    <option value="limpieza">Limpieza e Higiene</option>
                                    <option value="empaque">Insumos Secos y Gases</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Nombre / Identificación</label>
                                <input type="text" id="insumo-nombre" placeholder="Ej: Malta Pale Ale" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <!-- FILA STOCK Y UNIDADES -->
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cant. Actual</label>
                                <input type="number" step="any" id="insumo-stock" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Unidad</label>
                                <select id="insumo-unidad" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500 text-center">
                                    <option value="kg">kg</option>
                                    <option value="g">g</option>
                                    <option value="mL">mL</option>
                                    <option value="litros">litros</option>
                                    <option value="unidades">unidades</option>
                                    <option value="ninguno">ninguno</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cant. Mínima</label>
                                <input type="number" step="any" id="insumo-minimo" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-bold text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Bol. / Factura</label>
                                <input type="text" id="insumo-documento" placeholder="N° Doc" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <!-- FILA: FECHAS Y CADUCIDAD -->
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Lote Trazab.</label>
                                <input type="text" id="insumo-lote" placeholder="S/L" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Fecha de Ingreso</label>
                                <input type="date" id="insumo-fecha-ingreso" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-center">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Días Críticos (V. Útil)</label>
                                <input type="number" id="insumo-dias-criticos" placeholder="Ej: 180" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center focus:outline-none focus:border-amber-500">
                            </div>
                        </div>

                        <!-- FILA PARA EL CÓDIGO INTERNO GENERADO -->
                        <div class="bg-gray-850 p-3 rounded-xl border border-gray-700">
                            <label class="block text-xs font-bold uppercase text-amber-500 mb-0.5">Código Único de Trazabilidad App</label>
                            <input type="text" id="insumo-codigo-unico" readonly placeholder="Se generará automáticamente" class="w-full bg-transparent text-sm text-gray-300 font-mono font-bold focus:outline-none">
                        </div>

                        <div id="campos-dinamicos" class="bg-gray-950 p-4 rounded-xl border border-gray-800 grid grid-cols-1 sm:grid-cols-2 gap-3 min-h-[60px] items-center"></div>
                    </div>

                    <!-- SECCIÓN QR -->
                    <div class="bg-gray-950 p-4 rounded-2xl border border-gray-800 flex flex-col items-center justify-center text-center min-h-[220px]">
                        <span class="text-xs font-bold text-gray-500 uppercase mb-3">Trazabilidad QR Física</span>
                        <div id="qrcode-container" class="bg-white p-3 rounded-xl inline-block shadow-lg"></div>
                        <button id="btn-imprimir-qr" class="w-full bg-gray-800 hover:bg-gray-750 text-amber-500 font-bold text-xs py-2.5 rounded-xl mt-4 border border-amber-500/10 transition cursor-pointer">
                            🖨️ IMPRIMIR ETIQUETA QR
                        </button>
                    </div>
                </div>

                <!-- CONTROLES DEL FORMULARIO -->
                <div class="flex flex-col sm:flex-row gap-4 justify-between border-t border-gray-800 pt-4">
                    <div>
                        <button id="btn-eliminar" class="hidden bg-red-950/40 hover:bg-red-900/50 border border-red-800 text-red-400 font-bold px-5 py-3 rounded-xl transition cursor-pointer uppercase text-xs tracking-wider">
                            🗑️ Eliminar Insumo
                        </button>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 justify-end items-center">
                        <p id="form-error" class="text-red-400 text-sm font-semibold hidden"></p>
                        <div class="flex gap-3 justify-end w-full sm:w-auto">
                            <button id="btn-cancelar" class="bg-gray-750 text-gray-400 font-bold px-5 py-3 rounded-xl hover:bg-gray-700 transition cursor-pointer">Cancelar</button>
                            <button id="btn-guardar" class="bg-amber-500 text-gray-950 font-black px-8 py-3 rounded-xl hover:bg-amber-600 transition uppercase text-sm cursor-pointer">Guardar Ficha</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBSaIzbcFiyTF1zy9_9Z97ZSPfL322xO24",
            authDomain: "inventariochuyma-da052.firebaseapp.com",
            projectId: "inventariochuyma-da052",
            storageBucket: "inventariochuyma-da052.firebasestorage.app",
            messagingSenderId: "677439195293",
            appId: "1:677439195293:web:50b624de9e0c877c89ec74"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        var insumosLocales = [];
        var qrScanner = null;
        var idInsumoSeleccionado = null;
        var pestanaActual = "todas";

        var vistaLogin = document.getElementById('vista-login');
        var vistaApp = document.getElementById('vista-app');
        var errorTxt = document.getElementById('login-error');
        var buscador = document.getElementById('buscador');
        var listaInsumos = document.getElementById('lista-insumos');
        var formInsumo = document.getElementById('form-insumo');
        var formUso = document.getElementById('form-uso');
        var qrcodeContainer = document.getElementById('qrcode-container');
        var camposDinamicos = document.getElementById('campos-dinamicos');
        var formError = document.getElementById('form-error');
        var btnEliminar = document.getElementById('btn-eliminar');

        document.getElementById('btn-login').addEventListener('click', function(e) {
            e.preventDefault();
            errorTxt.classList.add('hidden');
            var email = document.getElementById('login-email').value.trim();
            var pass = document.getElementById('login-password').value.trim();
            if(!email || !pass) return;
            
            auth.signInWithEmailAndPassword(email, pass)
                .then(function() { console.log("Autenticación exitosa"); })
                .catch(function(error) {
                    console.error("Error de login:", error);
                    errorTxt.textContent = "Clave o usuario incorrecto.";
                    errorTxt.classList.remove('hidden');
                });
        });

        document.getElementById('btn-logout').addEventListener('click', function() { auth.signOut(); });

        auth.onAuthStateChanged(function(user) {
            if (user) {
                vistaLogin.classList.add('hidden');
                vistaApp.classList.remove('hidden');
                db.collection("inventario").onSnapshot(function(snapshot) {
                    insumosLocales = [];
                    snapshot.forEach(function(doc) {
                        insumosLocales.push(Object.assign({ id: doc.id }, doc.data()));
                    });
                    evaluarAlertasYRender();
                }, function(error) { console.error("Error base datos:", error); });
            } else {
                vistaLogin.classList.remove('hidden');
                vistaApp.classList.add('hidden');
            }
        });

        window.filtrarPorPestana = function(categoria) {
            pestanaActual = categoria;
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-gray-900 text-gray-400";
            });
            document.getElementById('tab-' + categoria).className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap bg-amber-500 text-gray-950 shadow";
            ejecutarFiltro();
        };

        function ejecutarFiltro() {
            var txt = buscador.value.toLowerCase();
            var filtrados = insumosLocales.filter(function(i) {
                var matchesTab = (pestanaActual === 'todas' || i.categoria === pestanaActual);
                var matchesTxt = i.nombre.toLowerCase().includes(txt) || 
                                 (i.lote && i.lote.toLowerCase().includes(txt)) ||
                                 (i.codigoUnico && i.codigoUnico.toLowerCase().includes(txt)) ||
                                 (i.documentoCompra && i.documentoCompra.toLowerCase().includes(txt));
                return matchesTab && matchesTxt;
            });
            renderLista(filtrados);
        }

        buscador.addEventListener('input', ejecutarFiltro);

        function evaluarAlertasYRender() {
            var quiebreActivo = false;
            insumosLocales.forEach(function(item) {
                if (item.minimo && Number(item.stock) <= Number(item.minimo)) quiebreActivo = true;
            });
            var statusDiv = document.getElementById('alerta-status');
            if (quiebreActivo) {
                statusDiv.innerHTML = '<span class="w-2.5 h-2.5 bg-red-500 rounded-full inline-block animate-ping"></span> CANTIDAD CRÍTICA';
                statusDiv.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-950/30 text-red-400 text-xs font-black border border-red-900/50";
            } else {
                statusDiv.innerHTML = '<span class="w-2.5 h-2.5 bg-green-400 rounded-full inline-block"></span> OPERACIÓN SEGURA';
                statusDiv.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-900 text-green-400 text-xs font-bold border border-gray-800";
            }
            ejecutarFiltro();
        }

        function renderLista(datos) {
            listaInsumos.innerHTML = "";
            if (datos.length === 0) {
                listaInsumos.innerHTML = `<div class="col-span-full text-center py-12 text-gray-600 font-medium text-sm">No hay registros.</div>`;
                return;
            }
            datos.forEach(function(item) {
                var esCritico = item.minimo && Number(item.stock) <= Number(item.minimo);
                var unidad = item.unidadMedida || 'unidades';

                var diasTexto = "";
                if (item.fechaIngreso) {
                    var fIngreso = new Date(item.fechaIngreso);
                    var fHoy = new Date();
                    var diffDias = Math.floor((fHoy - fIngreso) / (1000 * 60 * 60 * 24));
                    diasTexto = `<span class="text-[10px] text-gray-400 ml-2">(${diffDias} días en bodega)</span>`;
                    
                    if (item.diasCriticos && diffDias > Number(item.diasCriticos)) {
                        diasTexto = `<span class="text-[10px] text-red-400 font-bold ml-2">¡EXCEDIÓ DÍAS CRÍTICOS!</span>`;
                    }
                }

                var card = document.createElement('div');
                card.className = `bg-gray-900 p-5 rounded-2xl border transition shadow-lg flex flex-col justify-between h-48 ${esCritico ? 'border-red-600/60 shadow-red-950/10' : 'border-gray-850 hover:border-gray-800'}`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-black text-white text-lg truncate w-full">${item.nombre}</h3>
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-gray-850 text-amber-500">${item.categoria}</span>
                        </div>
                        <p class="text-xs font-bold text-gray-500 mt-0.5">Código: <span class="text-amber-500 font-mono">${item.codigoUnico || 'S/C'}</span></p>
                        <p class="text-[11px] text-gray-400">Lote: <span class="text-gray-300">${item.lote || 'S/L'}</span> ${diasTexto}</p>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-850 pt-3">
                        <div class="flex items-center gap-1.5">
                            <button onclick="cambiarStock('${item.id}', -1)" class="bg-gray-800 text-white w-11 h-11 rounded-xl font-black text-xl cursor-pointer">-</button>
                            <div class="text-center min-w-[60px]">
                                <span class="font-black text-xl text-white block">${item.stock}</span>
                                <span class="text-[9px] text-gray-500 uppercase font-bold block -mt-1">${unidad}</span>
                            </div>
                            <button onclick="cambiarStock('${item.id}', 1)" class="bg-gray-800 text-white w-11 h-11 rounded-xl font-black text-xl cursor-pointer">+</button>
                        </div>
                        <button onclick="verFicha('${item.id}')" class="bg-amber-500 text-gray-950 font-black px-4 py-2.5 rounded-xl text-xs uppercase cursor-pointer">Ver / Editar</button>
                    </div>
                `;
                listaInsumos.appendChild(card);
            });
        }

        window.cambiarStock = function(id, cambio) {
            var item = insumosLocales.find(function(i) { return i.id === id; });
            if(item) {
                var nuevoStock = Math.max(0, Number(item.stock) + cambio);
                db.collection("inventario").doc(id).update({ stock: nuevoStock })
                .catch(function(err){ console.error("Error stock:", err); });
            }
        };

        document.getElementById('btn-registrar-uso').addEventListener('click', function() {
            formInsumo.classList.add('hidden');
            formUso.classList.remove('hidden');
            
            var selectInsumo = document.getElementById('uso-insumo-id');
            selectInsumo.innerHTML = '<option value="">-- Selecciona un insumo --</option>';
            insumosLocales.forEach(function(i) {
                selectInsumo.innerHTML += `<option value="${i.id}">${i.nombre} (${i.codigoUnico || 'S/C'}) - Disp: ${i.stock} ${i.unidadMedida || ''}</option>`;
            });
            
            document.getElementById('uso-fecha').value = new Date().toISOString().split('T')[0];
            document.getElementById('uso-cantidad').value = "";
            document.getElementById('uso-lote-brewfather').value = "";
            document.getElementById('uso-error').classList.add('hidden');
        });

        document.getElementById('btn-cancelar-uso').addEventListener('click', function() {
            formUso.classList.add('hidden');
        });

        document.getElementById('btn-guardar-uso').addEventListener('click', function() {
            var id = document.getElementById('uso-insumo-id').value;
            var cant = Number(document.getElementById('uso-cantidad').value);
            var fecha = document.getElementById('uso-fecha').value;
            var brewfather = document.getElementById('uso-lote-brewfather').value.trim();
            var err = document.getElementById('uso-error');

            if (!id || !cant || cant <= 0 || !fecha) {
                err.textContent = "Completa el insumo, fecha y una cantidad válida mayor a 0.";
                err.classList.remove('hidden');
                return;
            }

            var item = insumosLocales.find(function(i) { return i.id === id; });
            if (!item) return;

            var nuevoStock = Math.max(0, Number(item.stock) - cant);

            db.collection("consumos").add({
                idInsumo: id,
                nombreInsumo: item.nombre,
                loteInsumo: item.lote || 'S/L',
                codigoUnicoInsumo: item.codigoUnico || 'S/C',
                cantidadUsada: cant,
                unidadMedida: item.unidadMedida || 'unidades',
                fechaConsumo: fecha,
                loteBrewfather: brewfather
            }).then(function() {
                return db.collection("inventario").doc(id).update({ stock: nuevoStock });
            }).then(function() {
                formUso.classList.add('hidden');
            }).catch(function(error) {
                err.textContent = "Error al registrar el uso. Revisa conexión.";
                err.classList.remove('hidden');
            });
        });

        document.getElementById('insumo-categoria').addEventListener('change', function(e) { pintarCamposDinamicos(e.target.value); });

        function pintarCamposDinamicos(cat, datos) {
            datos = datos || {};
            camposDinamicos.innerHTML = "";
            
            if (cat === 'malta') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Origen / Proveedor</label><input type="text" id="m-origen" value="${datos.origen || ''}" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Color (EBC / Lovibond)</label><input type="text" id="m-color" value="${datos.color || ''}" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></div>
                `;
            } else if (cat === 'lupulo') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Formato Presentación</label><select id="l-formato" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Pellets (T90)" ${datos.formato === 'Pellets (T90)' ? 'selected' : ''}>Pellets (T90)</option>
                        <option value="Plug" ${datos.formato === 'Plug' ? 'selected' : ''}>Plug</option>
                        <option value="Flor" ${datos.formato === 'Flor' ? 'selected' : ''}>Flor (Whole)</option>
                        <option value="Cryo" ${datos.formato === 'Cryo' ? 'selected' : ''}>Extracto / Cryo</option>
                    </select></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Alfa-Ácidos (% AA)</label><input type="text" id="l-alfa" value="${datos.alfa || ''}" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></div>
                `;
            } else if (cat === 'clarificante') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Tipo de Uso</label><select id="c-uso" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Hervido" ${datos.uso === 'Hervido' ? 'selected' : ''}>Hervido (Hot Side)</option>
                        <option value="Maduración" ${datos.uso === 'Maduración' ? 'selected' : ''}>Maduración (Cold Side)</option>
                    </select></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Formato</label><select id="c-formato" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Tabletas" ${datos.formato === 'Tabletas' ? 'selected' : ''}>Tabletas</option>
                        <option value="Polvo" ${datos.formato === 'Polvo' ? 'selected' : ''}>Polvo</option>
                        <option value="Líquido" ${datos.formato === 'Líquido' ? 'selected' : ''}>Líquido</option>
                    </select></div>
                `;
            } else if (cat === 'laboratorio') {
                camposDinamicos.innerHTML = `
                    <div class="sm:col-span-2"><label class="text-[10px] font-bold text-gray-400 uppercase">Tipo de Insumo / Solución</label><select id="lab-sub" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Insumo" ${datos.sub === 'Insumo' ? 'selected' : ''}>Insumo</option>
                        <option value="Reactivo" ${datos.sub === 'Reactivo' ? 'selected' : ''}>Reactivo</option>
                        <option value="Solución Preparada" ${datos.sub === 'Solución Preparada' ? 'selected' : ''}>Solución Preparada</option>
                        <option value="Estándar" ${datos.sub === 'Estándar' ? 'selected' : ''}>Estándar</option>
                        <option value="Otro" ${datos.sub === 'Otro' ? 'selected' : ''}>Otro</option>
                    </select></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Fecha de Preparación</label><input type="date" id="lab-fecha-preparacion" value="${datos.fechaPreparacion || ''}" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Fecha de Expiración</label><input type="date" id="lab-fecha-expiracion" value="${datos.fechaExpiracion || ''}" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></div>
                `;
            } else if (cat === 'levadura') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Laboratorio / Proveedor</label><input type="text" id="lev-lab" value="${datos.laboratorio || ''}" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Formato Cepa</label><select id="lev-formato" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Seca" ${datos.formato === 'Seca' ? 'selected' : ''}>Seca (Dry)</option>
                        <option value="Líquida" ${datos.formato === 'Líquida' ? 'selected' : ''}>Líquida (Liquid)</option>
                        <option value="Barro" ${datos.formato === 'Barro' ? 'selected' : ''}>Barro Reutilizado (Slurry)</option>
                    </select></div>
                `;
            } else if (cat === 'limpieza') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Tipo de Insumo</label><select id="lim-tipo" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Material Desechable" ${datos.tipo === 'Material Desechable' ? 'selected' : ''}>Material Desechable</option>
                        <option value="Químico" ${datos.tipo === 'Químico' ? 'selected' : ''}>Químico de Limpieza</option>
                        <option value="Agua Tratada" ${datos.tipo === 'Agua Tratada' ? 'selected' : ''}>Agua Tratada</option>
                    </select></div>
                `;
            } else if (cat === 'empaque') {
                camposDinamicos.innerHTML = `
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Tipo de Seco / Gas</label>
                        <select id="emp-tipo" onchange="toggleEmpaqueLabel(this.value)" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                            <option value="Botellas" ${datos.tipo === 'Botellas' ? 'selected' : ''}>Botellas</option>
                            <option value="Cajas" ${datos.tipo === 'Cajas' ? 'selected' : ''}>Cajas</option>
                            <option value="Tapas Corona" ${datos.tipo === 'Tapas Corona' ? 'selected' : ''}>Tapas Corona</option>
                            <option value="Latas" ${datos.tipo === 'Latas' ? 'selected' : ''}>Latas</option>
                            <option value="Tapas de Latas" ${datos.tipo === 'Tapas de Latas' ? 'selected' : ''}>Tapas de Latas</option>
                            <option value="Etiquetas" ${datos.tipo === 'Etiquetas' ? 'selected' : ''}>Etiquetas</option>
                            <option value="CO2" ${datos.tipo === 'CO2' ? 'selected' : ''}>CO2 (Dióxido de Carbono)</option>
                        </select></div>
                    <div><label id="label-seco-variable" class="text-[10px] font-bold text-gray-400 uppercase">Capacidad / Volumen</label>
                         <input type="text" id="emp-variable" value="${datos.variable || ''}" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></div>
                `;
            }
        }

        window.toggleEmpaqueLabel = function(val) {
            var label = document.getElementById('label-seco-variable');
            if (!label) return;
            if (val === 'Etiquetas') { label.textContent = "Producto al que pertenece"; } 
            else if (val === 'CO2') { label.textContent = "Capacidad del Cilindro / Formato"; } 
            else { label.textContent = "Capacidad / Volumen"; }
        };

        window.verFicha = function(id) {
            idInsumoSeleccionado = id;
            var item = insumosLocales.find(function(i) { return i.id === id; });
            if(!item) { alert("Insumo no encontrado."); return; }
            
            formUso.classList.add('hidden');
            formError.classList.add('hidden');
            btnEliminar.classList.remove('hidden');
            
            document.getElementById('form-titulo').textContent = "Detalle e Historial del Insumo";
            document.getElementById('insumo-categoria').value = item.categoria;
            document.getElementById('insumo-nombre').value = item.nombre;
            document.getElementById('insumo-stock').value = item.stock;
            document.getElementById('insumo-unidad').value = item.unidadMedida || 'kg';
            document.getElementById('insumo-minimo').value = item.minimo || "";
            document.getElementById('insumo-lote').value = item.lote || '';
            document.getElementById('insumo-documento').value = item.documentoCompra || '';
            document.getElementById('insumo-fecha-ingreso').value = item.fechaIngreso || '';
            document.getElementById('insumo-dias-criticos').value = item.diasCriticos || '';
            document.getElementById('insumo-codigo-unico').value = item.codigoUnico || 'No asignado';
            
            pintarCamposDinamicos(item.categoria, item);
            
            if(item.categoria === 'empaque' && item.tipo) {
                setTimeout(function() {
                    var tipoSelect = document.getElementById('emp-tipo');
                    if(tipoSelect) {
                        tipoSelect.value = item.tipo;
                        toggleEmpaqueLabel(item.tipo);
                    }
                }, 50);
            }

            qrcodeContainer.innerHTML = "";
            new QRCode(qrcodeContainer, { text: item.codigoUnico || id, width: 120, height: 120 });
            formInsumo.classList.remove('hidden');
            formInsumo.scrollIntoView({ behavior: 'smooth' });
        };

        document.getElementById('btn-nuevo-insumo').addEventListener('click', function() {
            idInsumoSeleccionado = null;
            formUso.classList.add('hidden');
            formError.classList.add('hidden');
            btnEliminar.classList.add('hidden');
            
            document.getElementById('form-titulo').textContent = "Registrar Nuevo Elemento";
            document.getElementById('insumo-nombre').value = "";
            document.getElementById('insumo-stock').value = "";
            document.getElementById('insumo-unidad').value = "kg";
            document.getElementById('insumo-minimo').value = "";
            document.getElementById('insumo-lote').value = "";
            document.getElementById('insumo-documento').value = "";
            document.getElementById('insumo-codigo-unico').value = "";
            
            document.getElementById('insumo-fecha-ingreso').value = new Date().toISOString().split('T')[0];
            document.getElementById('insumo-dias-criticos').value = "";

            qrcodeContainer.innerHTML = "<p class='text-[10px] text-gray-500 p-4 font-bold uppercase border border-dashed border-gray-800 rounded-xl'>Se creará al guardar</p>";
            pintarCamposDinamicos('malta');
            formInsumo.classList.remove('hidden');
            formInsumo.scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('btn-cancelar').addEventListener('click', function() { formInsumo.classList.add('hidden'); });

        btnEliminar.addEventListener('click', function() {
            if (!idInsumoSeleccionado) return;
            var conf1 = confirm("¿Estás segura de que quieres eliminar este insumo de la bodega?");
            if (conf1) {
                var conf2 = confirm("¡Cuidado Cony! Esta acción purgará el registro permanentemente de Firebase. ¿Confirmas la purga?");
                if (conf2) {
                    db.collection("inventario").doc(idInsumoSeleccionado).delete()
                    .then(function() {
                        formInsumo.classList.add('hidden');
                        idInsumoSeleccionado = null;
                    })
                    .catch(function(err) {
                        formError.textContent = "Error al intentar purgar el insumo.";
                        formError.classList.remove('hidden');
                    });
                }
            }
        });

        function limpiarNombreParaPrefijo(nombre) {
            if (!nombre) return "INS";
            var limpio = nombre.replace(/\s+/g, '');
            limpio = limpio.replace(/[^a-zA-Z0-9]/g, '');
            if (limpio.length <= 5) return limpio;
            return limpio.substring(0, 5); 
        }

        document.getElementById('btn-guardar').addEventListener('click', function() {
            formError.classList.add('hidden');
            var cat = document.getElementById('insumo-categoria').value;
            var nombreVal = document.getElementById('insumo-nombre').value.trim();
            
            if (!nombreVal) {
                formError.textContent = "El nombre es obligatorio.";
                formError.classList.remove('hidden');
                return;
            }

            var payload = {
                categoria: cat,
                nombre: nombreVal,
                stock: Number(document.getElementById('insumo-stock').value) || 0,
                unidadMedida: document.getElementById('insumo-unidad').value,
                minimo: document.getElementById('insumo-minimo').value ? Number(document.getElementById('insumo-minimo').value) : 0,
                lote: document.getElementById('insumo-lote').value.trim() || 'S/L',
                documentoCompra: document.getElementById('insumo-documento').value.trim() || '',
                fechaIngreso: document.getElementById('insumo-fecha-ingreso').value || '',
                diasCriticos: document.getElementById('insumo-dias-criticos').value ? Number(document.getElementById('insumo-dias-criticos').value) : 0
            };

            if(cat === 'malta') {
                payload.origen = document.getElementById('m-origen')?.value || '';
                payload.color = document.getElementById('m-color')?.value || '';
            } else if(cat === 'lupulo') {
                payload.formato = document.getElementById('l-formato')?.value || '';
                payload.alfa = document.getElementById('l-alfa')?.value || '';
            } else if(cat === 'clarificante') {
                payload.uso = document.getElementById('c-uso')?.value || '';
                payload.formato = document.getElementById('c-formato')?.value || '';
            } else if(cat === 'laboratorio') {
                payload.sub = document.getElementById('lab-sub')?.value || '';
                payload.fechaPreparacion = document.getElementById('lab-fecha-preparacion')?.value || '';
                payload.fechaExpiracion = document.getElementById('lab-fecha-expiracion')?.value || '';
            } else if(cat === 'levadura') {
                payload.laboratorio = document.getElementById('lev-lab')?.value || '';
                payload.formato = document.getElementById('lev-formato')?.value || '';
            } else if(cat === 'limpieza') {
                payload.tipo = document.getElementById('lim-tipo')?.value || '';
            } else if(cat === 'empaque') {
                payload.tipo = document.getElementById('emp-tipo')?.value || '';
                payload.variable = document.getElementById('emp-variable')?.value || '';
            }

            if (idInsumoSeleccionado) {
                db.collection("inventario").doc(idInsumoSeleccionado).update(payload)
                .then(function() {
                    formInsumo.classList.add('hidden');
                    idInsumoSeleccionado = null;
                })
                .catch(function(error) {
                    formError.textContent = "Error de red al actualizar.";
                    formError.classList.remove('hidden');
                });
            } else {
                var nuevaRef = db.collection("inventario").doc();
                
                var prefijo = limpiarNombreParaPrefijo(nombreVal);
                // CAMBIO AQUÍ: Generamos un número aleatorio estricto de 5 dígitos (entre 10000 y 99999)
                var numeroAleatorio = Math.floor(10000 + Math.random() * 90000);
                var codigoFinal = prefijo + "-" + numeroAleatorio;
                
                payload.codigoUnico = codigoFinal;

                nuevaRef.set(payload)
                .then(function() {
                    formInsumo.classList.add('hidden');
                    idInsumoSeleccionado = null;
                })
                .catch(function(error) {
                    formError.textContent = "Error al guardar el nuevo insumo.";
                    formError.classList.remove('hidden');
                });
            }
        });

        document.getElementById('btn-imprimir-qr').addEventListener('click', function() {
            var nombre = document.getElementById('insumo-nombre').value || "Insumo Chuyma";
            var lote = document.getElementById('insumo-lote').value || "S/L";
            var codUnico = document.getElementById('insumo-codigo-unico').value || "";
            var win = window.open('', '_blank', 'width=400,height=400');
            win.document.write('<html><body style="text-align:center;font-family:sans-serif;padding:20px;"><h2>CHUYMA BODEGA</h2><p><b>'+nombre+'</b></p><p>Código App: <span style="font-family:monospace;color:#f59e0b;font-weight:bold;">'+codUnico+'</span></p><p>Lote Fábrica: '+lote+'</p><div style="display:flex;justify-content:center;margin-top:15px;">'+qrcodeContainer.innerHTML+'</div><script>window.onload=function(){window.print();setTimeout(function(){window.close();},300);}<\/script></body></html>');
            win.document.close();
        });

        document.getElementById('btn-abrir-camara').addEventListener('click', function() {
            document.getElementById('contenedor-camara').classList.remove('hidden');
            qrScanner = new Html5Qrcode("lector-qr");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 },
                function(textoScaneado) {
                    var codigoQuery = textoScaneado.trim();
                    qrScanner.stop().then(function() {
                        document.getElementById('contenedor-camara').classList.add('hidden');
                        
                        var itemEncontrado = insumosLocales.find(function(i) { 
                            return i.codigoUnico === codigoQuery || i.id === codigoQuery; 
                        });
                        
                        if (itemEncontrado) {
                            verFicha(itemEncontrado.id);
                        } else {
                            alert("Código QR detectado (" + codigoQuery + ") pero no coincide con ningún insumo activo en Chuyma.");
                        }
                    });
                }, function() {}
            ).catch(function() { document.getElementById('contenedor-camara').classList.add('hidden'); });
        });

        document.getElementById('btn-cerrar-camara').addEventListener('click', function() {
            if (qrScanner) { qrScanner.stop().then(function() { document.getElementById('contenedor-camara').classList.add('hidden'); }); } 
            else { document.getElementById('contenedor-camara').classList.add('hidden'); }
        });
    </script>
</body>
</html>
